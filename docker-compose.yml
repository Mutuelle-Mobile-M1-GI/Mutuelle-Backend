version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DEBUG: 'False'
      SECRET_KEY: 'change-me-in-production'
      DATABASE_URL: 'postgresql://mutuelle_user:mutuelle_password@host.docker.internal:5432/mutuelle_db'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
